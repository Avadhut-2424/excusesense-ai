services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excusesense_api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-excusesense}:${POSTGRES_PASSWORD:-excusesense}@db:5432/${POSTGRES_DB:-excusesense}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: excusesense_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-excusesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-excusesense}
      POSTGRES_DB: ${POSTGRES_DB:-excusesense}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-excusesense} -d ${POSTGRES_DB:-excusesense}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional legacy Streamlit dashboard service
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excusesense_streamlit
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
